[package]
name = "filemorph"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.6"
tokio = { version = "1", features = ["full"] }
image = "0.25"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.11"
tar = "0.4"
calamine = "0.21"
rust_xlsxwriter = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
